<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient (Aqua iOS Glass) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#5856D6" />
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0f9ff" stop-opacity="0.88" />
    </linearGradient>

    <!-- Check Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C7BE" />
      <stop offset="100%" stop-color="#007AFF" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#002b66" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Rounded Base Frame (iOS Squircle shape) -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Glass Top Reflection -->
  <rect x="2" y="2" width="60" height="30" rx="15" fill="url(#glassGloss)" />

  <!-- Mini Calendar / Planner Sheet Inside -->
  <rect x="11" y="11" width="42" height="42" rx="9" fill="url(#cardGrad)" />

  <!-- Calendar Top Header Bar (Electric Aqua) -->
  <path d="M 11 20 C 11 15 15 11 20 11 L 44 11 C 49 11 53 15 53 20 L 53 23 L 11 23 Z" fill="url(#accentGrad)" />

  <!-- Calendar Binder Rings / Pins -->
  <rect x="19" y="8" width="4" height="6" rx="2" fill="#ffffff" />
  <rect x="41" y="8" width="4" height="6" rx="2" fill="#ffffff" />

  <!-- Organized Schedule Grid Lines / Habit Bars -->
  <!-- Line 1 with check bullet -->
  <circle cx="18" cy="30" r="2.5" fill="#38bdf8" />
  <rect x="24" y="28.5" width="22" height="3" rx="1.5" fill="#94a3b8" />

  <!-- Line 2 with success check bullet -->
  <circle cx="18" cy="38" r="2.5" fill="#10b981" />
  <rect x="24" y="36.5" width="16" height="3" rx="1.5" fill="#cbd5e1" />

  <!-- Glowing Sparkle / Star in bottom corner -->
  <path d="M 44 38 L 45.2 41.5 L 48.7 42.7 L 45.2 43.9 L 44 47.4 L 42.8 43.9 L 39.3 42.7 L 42.8 41.5 Z" fill="#f59e0b" />
</svg>
