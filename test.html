<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Organizador Semanal - Test Runner</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
    .container { max-width: 800px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 2rem; border: 1px solid #334155; }
    h1 { margin-top: 0; font-size: 1.5rem; color: #38bdf8; }
    .test-log { background: #0f172a; border-radius: 8px; padding: 1rem; font-family: monospace; font-size: 0.9rem; line-height: 1.6; border: 1px solid #334155; margin-top: 1rem; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
    .header-group { color: #94a3b8; font-weight: bold; margin-top: 0.8rem; }
    .summary { font-size: 1.2rem; font-weight: bold; margin-top: 1.5rem; padding: 1rem; border-radius: 8px; text-align: center; }
    .summary.success { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Organizador Semanal - Testes Automatizados</h1>
    <p>Verificação de modelos de domínio, datas sem desvio de fuso horário, recorrências, <strong>Habit Tracker (Semanal e Mensal)</strong> e <strong>Plano Alimentar</strong>.</p>
    <div id="output" class="test-log">Executando testes...</div>
    <div id="summary"></div>
  </div>

  <script type="module">
    import { DateUtils, RECURRENCE_TYPES, generateId } from './js/domain/models.js';
    import { RecurrenceEngine } from './js/domain/recurrence.js';
    import { HabitUtils } from './js/domain/habitsModel.js';
    import { MealUtils } from './js/domain/mealPlanModel.js';

    const out = document.getElementById('output');
    const summary = document.getElementById('summary');
    out.innerHTML = '';

    let passed = 0;
    let failed = 0;

    function log(msg, type = 'info') {
      const div = document.createElement('div');
      div.className = type;
      div.textContent = msg;
      out.appendChild(div);
    }

    function assert(condition, message) {
      if (condition) {
        log(`✔ PASS: ${message}`, 'pass');
        passed++;
      } else {
        log(`✖ FAIL: ${message}`, 'fail');
        failed++;
      }
    }

    log('[1/6] Testando Utilitários de Data e Imunidade a Fuso Horário...', 'header-group');
    const dateStr = '2026-08-24';
    assert(DateUtils.formatDateKey(dateStr) === '2026-08-24', 'formatDateKey de "2026-08-24" é "2026-08-24"');
    const parsed = DateUtils.parseDateKey(dateStr);
    assert(parsed.getDate() === 24, 'parseDateKey("2026-08-24").getDate() é 24');
    const monday = DateUtils.getMondayOfWeek('2026-08-27');
    const weekDays = DateUtils.getWeekDays(monday);
    assert(weekDays.length === 7, 'Semana contém 7 dias');

    log('[2/6] Testando Criação e Exibição de Atividades Simples...', 'header-group');
    const singleActivity = {
      id: generateId(),
      userId: 'usr_test',
      title: 'Consulta Médica',
      date: '2026-08-26',
      time: '14:30',
      category: 'saude',
      recurrence: RECURRENCE_TYPES.NONE
    };
    assert(RecurrenceEngine.occursOnDate(singleActivity, '2026-08-26'), 'Atividade simples ocorre em 2026-08-26');

    log('[3/6] Testando Recorrências e Overrides...', 'header-group');
    const recurringActivity = {
      id: generateId(),
      userId: 'usr_test',
      title: 'Treino Funcional',
      date: '2026-08-24',
      time: '18:00',
      category: 'saude',
      recurrence: RECURRENCE_TYPES.CUSTOM_DAYS,
      recurrenceDays: [2, 3, 4],
      recurrenceEndDate: '2026-08-28',
      completedDates: ['2026-08-25'],
      overrides: { '2026-08-26': { title: 'Treino Especial', time: '19:00' } },
      deletedDates: ['2026-08-27']
    };
    assert(RecurrenceEngine.occursOnDate(recurringActivity, '2026-08-25'), 'Ocorre na Terça (25/08)');
    assert(!RecurrenceEngine.occursOnDate(recurringActivity, '2026-08-27'), 'NÃO ocorre na Quinta (cancelada pontualmente)');

    log('[4/6] Testando Habit Tracker (Semanal e Mensal)...', 'header-group');
    let habit = HabitUtils.createHabit('usr_test', 'Beber 2L de água', '💧', 7);
    habit = HabitUtils.toggleDate(habit, '2026-08-24');
    habit = HabitUtils.toggleDate(habit, '2026-08-25');
    assert(HabitUtils.isCompletedOnDate(habit, '2026-08-24'), 'Hábito marcado na segunda 24/08');
    assert(!HabitUtils.isCompletedOnDate(habit, '2026-08-26'), 'Hábito não marcado na quarta 26/08');
    const weeklyStats = HabitUtils.getWeeklyStats(habit, weekDays);
    assert(weeklyStats.completedCount === 2, 'Progresso semanal: 2 dias concluídos');
    const monthStats = HabitUtils.getMonthStats(habit, 2026, 7);
    assert(monthStats.totalDays === 31, 'Agosto possui 31 dias');
    assert(monthStats.completedCount === 2, 'Agosto possui 2 dias concluídos');

    log('[5/6] Testando Plano Alimentar Semanal...', 'header-group');
    const mealsMap = {
      '2026-08-24': {
        breakfast: { text: 'Ovos mexidos + Café', completed: true },
        lunch: { text: 'Frango grelhado + Arroz', completed: false }
      }
    };
    const mondayMeals = MealUtils.getDayMeals(mealsMap, '2026-08-24');
    assert(mondayMeals.breakfast.text === 'Ovos mexidos + Café', 'Texto do café da manhã coincide');
    assert(mondayMeals.breakfast.completed === true, 'Café da manhã marcado como concluído');
    assert(mondayMeals.lunch.completed === false, 'Almoço não concluído');

    log('[6/6] Testando Estrutura de Backup JSON v1.2...', 'header-group');
    const backupObj = {
      version: '1.2',
      exportedAt: new Date().toISOString(),
      users: [{ id: 'usr_test', name: 'Teste' }],
      userData: { usr_test: { activities: [singleActivity], habits: [habit], meals: mealsMap } }
    };
    const parsedBackup = JSON.parse(JSON.stringify(backupObj));
    assert(parsedBackup.version === '1.2', 'Backup version é 1.2');
    assert(parsedBackup.userData.usr_test.habits.length === 1, 'Backup contém 1 hábito');

    if (failed === 0) {
      summary.className = 'summary success';
      summary.textContent = `✔ TODOS OS ${passed} TESTES PASSARAM COM SUCESSO!`;
    } else {
      summary.className = 'summary fail';
      summary.textContent = `✖ ${failed} TESTES FALHARAM!`;
    }
  </script>
</body>
</html>
