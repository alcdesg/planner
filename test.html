<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organizador Semanal - Suíte de Testes Automatizados & Segurança</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/tokens.css" />
  <style>
    body {
      font-family: var(--font-sans);
      background: #0f172a;
      color: #f8fafc;
      padding: 30px;
      line-height: 1.5;
    }
    .test-container {
      max-width: 860px;
      margin: 0 auto;
      background: #1e293b;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    .summary-card {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      padding: 16px;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .stat-box {
      flex: 1;
      text-align: center;
    }
    .stat-num {
      font-size: 1.8rem;
      font-weight: 800;
    }
    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 700;
    }
    .test-log {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: monospace;
      font-size: 0.85rem;
    }
    .test-item {
      padding: 8px 12px;
      border-radius: 6px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-left: 4px solid transparent;
    }
    .test-item.pass {
      border-left-color: #10b981;
    }
    .test-item.fail {
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }
    .badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .badge-pass { background: #065f46; color: #34d399; }
    .badge-fail { background: #7f1d1d; color: #f87171; }
    .badge-sec { background: #312e81; color: #a5b4fc; margin-right: 6px; }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>🧪 Suíte de Testes Automatizados & Segurança</h1>
    <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 16px;">
      Validação de modelos de domínio, fuso horário, recorrências, Habit Tracker, Meal Planner e Segurança Adversarial.
    </p>

    <div class="summary-card">
      <div class="stat-box">
        <div class="stat-num" id="total-count" style="color: #38bdf8;">0</div>
        <div class="stat-label">Total de Testes</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="pass-count" style="color: #10b981;">0</div>
        <div class="stat-label">Passaram</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="fail-count" style="color: #ef4444;">0</div>
        <div class="stat-label">Falharam</div>
      </div>
    </div>

    <div class="test-log" id="log-container"></div>
  </div>

  <script type="module">
    import { DateUtils, RECURRENCE_TYPES, generateId } from './js/domain/models.js';
    import { RecurrenceEngine } from './js/domain/recurrence.js';
    import { HabitUtils } from './js/domain/habitsModel.js';
    import { MealUtils } from './js/domain/mealPlanModel.js';
    import { runSecurityTestSuite } from './tests/security_tests.js';

    let total = 0;
    let passed = 0;
    let failed = 0;

    const logContainer = document.getElementById('log-container');
    const totalEl = document.getElementById('total-count');
    const passEl = document.getElementById('pass-count');
    const failEl = document.getElementById('fail-count');

    function logTest(isPass, title, isSec = false, details = '') {
      total++;
      if (isPass) passed++; else failed++;

      const el = document.createElement('div');
      el.className = `test-item ${isPass ? 'pass' : 'fail'}`;
      el.innerHTML = `
        <div>
          ${isSec ? '<span class="badge badge-sec">SECURITY</span>' : ''}
          <span>${title}</span>
          ${details ? `<div style="font-size: 0.72rem; color: #64748b; margin-top: 2px;">${details}</div>` : ''}
        </div>
        <span class="badge ${isPass ? 'badge-pass' : 'badge-fail'}">${isPass ? 'PASS' : 'FAIL'}</span>
      `;
      logContainer.appendChild(el);

      totalEl.textContent = total;
      passEl.textContent = passed;
      failEl.textContent = failed;
    }

    // 1. DateUtils Tests
    logTest(DateUtils.formatDateKey('2026-08-24') === '2026-08-24', 'DateUtils: Imunidade a Fuso Horário');
    logTest(DateUtils.getWeekDays(DateUtils.getMondayOfWeek('2026-08-27')).length === 7, 'DateUtils: Geração de 7 dias da semana');

    // 2. Recurrence Tests
    const act = { id: '1', date: '2026-08-24', recurrence: RECURRENCE_TYPES.NONE };
    logTest(RecurrenceEngine.occursOnDate(act, '2026-08-24'), 'Recurrence: Atividade pontual ocorre na data correta');
    logTest(!RecurrenceEngine.occursOnDate(act, '2026-08-25'), 'Recurrence: Atividade pontual não ocorre em outra data');

    // 3. Habit Tracker Tests
    let hab = HabitUtils.createHabit('u1', 'Água 2L', '💧', 7);
    hab = HabitUtils.toggleDate(hab, '2026-08-24');
    logTest(HabitUtils.isCompletedOnDate(hab, '2026-08-24'), 'Habit Tracker: Toggle de conclusão diária');
    logTest(HabitUtils.getWeeklyStats(hab, DateUtils.getWeekDays('2026-08-24')).completedCount === 1, 'Habit Tracker: Cálculo de estatística semanal');

    // 4. Meal Plan Tests (Expanded 6 meals)
    const emptyMeal = MealUtils.getEmptyDayMeals();
    logTest(
      emptyMeal.breakfast.completed === false &&
      emptyMeal.morning_snack.completed === false &&
      emptyMeal.lunch.completed === false &&
      emptyMeal.snack.completed === false &&
      emptyMeal.dinner.completed === false &&
      emptyMeal.supper.completed === false,
      'Meal Planner: Suporte a 6 refeições (incluindo lanches opcionais)'
    );

    // 5. Custom Categories & Emoji Tests
    import('./js/domain/models.js').then(({ getAllCategories, getCategoryById }) => {
      const customCats = [{ id: 'cat_rocket', name: 'Startup', icon: '🚀' }];
      const allCats = getAllCategories(customCats);
      logTest(allCats.cat_rocket && allCats.cat_rocket.icon === '🚀', 'Custom Categories: Criação com emoji livre 🚀');
      logTest(allCats.trabalho && allCats.trabalho.icon === '💼', 'Custom Categories: Preservação das categorias padrão');
      const resolved = getCategoryById('cat_rocket', customCats);
      logTest(resolved.label === 'Startup' && resolved.icon === '🚀', 'Custom Categories: Resolução por ID');
    });

    // 6. Security & Adversarial Tests
    runSecurityTestSuite((res) => {
      logTest(res.status === 'PASS', res.name, true, res.details);
    });
  </script>
</body>
</html>
