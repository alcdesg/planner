<!DOCTYPE html>
<html lang="pt-BR" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Organizador Semanal - Quadro pessoal, Habit Tracker e Plano Alimentar com simplicidade e clareza." />
  <title>Organizador Semanal</title>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Design System & Styles -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Main Sticky Header -->
    <header class="app-header" id="app-header"></header>

    <!-- Main Workspace -->
    <main class="main-content">
      <!-- Week View Board (7 columns) -->
      <section id="week-view-container" aria-label="Visão Semanal"></section>

      <!-- Today Focused View -->
      <section id="today-view-container" aria-label="Visão de Hoje" style="display: none;"></section>

      <!-- Habit Tracker View (Weekly & Monthly) -->
      <section id="habit-view-container" aria-label="Rastreador de Hábitos" style="display: none;"></section>

      <!-- Weekly Meal Plan View -->
      <section id="meal-view-container" aria-label="Plano Alimentar Semanal" style="display: none;"></section>
    </main>
  </div>

  <!-- Modal Dialog Containers -->
  <div class="modal-backdrop" id="activity-modal-container" aria-hidden="true"></div>
  <div class="modal-backdrop" id="user-modal-container" aria-hidden="true"></div>
  <div class="modal-backdrop" id="habit-modal-container" aria-hidden="true"></div>
  <div class="modal-backdrop" id="meal-modal-container" aria-hidden="true"></div>

  <!-- App Entry Point (Native ES Modules) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
